services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile-Backend
    restart: unless-stopped
    environment:
      PORT: 4046
      DATA_DIR: /home/node/app/data
      ADMIN_CODE: ${ADMIN_CODE:?Set ADMIN_CODE in your .env file}
      PLAYER_JOIN_CODE: ${PLAYER_JOIN_CODE:-}
      PLAYER_AUTH_REQUIRED: ${PLAYER_AUTH_REQUIRED:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-mailto:admin@example.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      - game-data:/home/node/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4046/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile-Frontend
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  game-data:
