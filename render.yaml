services:
  - type: web
    name: among-us-irl
    env: node
    plan: free
    buildCommand: npm ci && npm ci --prefix web && npm run build
    startCommand: NODE_ENV=production node src/index.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_CODE
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: PUSH_SUBJECT
        value: mailto:admin@example.com
      - key: DATA_DIR
        value: data
