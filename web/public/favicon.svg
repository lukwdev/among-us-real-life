<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2f3a" />
      <stop offset="100%" stop-color="#14161d" />
    </radialGradient>
    
    <!-- Body Red Gradient -->
    <linearGradient id="crew-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="45%" stop-color="#e53935" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Backpack Gradient -->
    <linearGradient id="crew-pack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d32f2f" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>

    <!-- Visor Glass Gradient -->
    <linearGradient id="visor-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b2ebf2" />
      <stop offset="25%" stop-color="#4dd0e1" />
      <stop offset="70%" stop-color="#00bcd4" />
      <stop offset="100%" stop-color="#00695c" />
    </linearGradient>

    <!-- Visor Highlight -->
    <linearGradient id="visor-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadow for Character -->
    <filter id="char-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Background Tile -->
  <rect width="512" height="512" rx="115" fill="url(#bg-glow)" stroke="#333842" stroke-width="4"/>

  <!-- Character Group with Shadow -->
  <g filter="url(#char-shadow)">
    <!-- Oxygen Backpack -->
    <rect x="110" y="195" width="75" height="155" rx="36" 
          fill="url(#crew-pack)" stroke="#111111" stroke-width="15" stroke-linejoin="round"/>

    <!-- Main Body & Legs -->
    <path d="M 270 105
             C 195 105 160 160 160 235
             L 160 380
             C 160 410 175 425 205 425
             C 235 425 240 405 240 380
             L 240 355
             C 245 350 265 350 270 355
             L 270 380
             C 270 405 275 425 305 425
             C 335 425 350 410 350 380
             L 350 235
             C 350 160 330 105 270 105 Z"
          fill="url(#crew-red)" stroke="#111111" stroke-width="15" stroke-linejoin="round"/>

    <!-- Shadow layer on lower body/legs -->
    <path d="M 162 310
             C 180 340 220 350 255 350
             C 300 350 340 330 348 310
             L 350 380
             C 350 410 335 425 305 425
             C 275 425 270 405 270 380
             L 270 355
             C 265 350 245 350 240 355
             L 240 380
             C 240 405 235 425 205 425
             C 175 425 160 410 160 380 Z"
          fill="#990000" opacity="0.35"/>

    <!-- Visor (Goggles) -->
    <!-- Visor Outline & Base -->
    <rect x="235" y="170" width="135" height="85" rx="42.5"
          fill="url(#visor-glass)" stroke="#111111" stroke-width="15" stroke-linejoin="round"/>

    <!-- Visor Reflection Highlight -->
    <ellipse cx="295" cy="195" rx="42" ry="16" transform="rotate(-8 295 195)"
             fill="url(#visor-shine)"/>
  </g>
</svg>
